apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ms-database-analysis-hpa
  namespace: parking
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ms-database-analysis-deployment
  minReplicas: 1
  maxReplicas: 1
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 150
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 95
