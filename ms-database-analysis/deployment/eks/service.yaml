apiVersion: v1
kind: Service
metadata:
  name: ms-database-analysis-service
  namespace: parking
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing  # 🚀 HACE QUE SEA PÚBLICO
spec:
  type: LoadBalancer
  selector:
    app: ms-database-analysis
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080