version: '3.8'

services:
  traefik:
    image: traefik:v3.6.10
    container_name: traefik
    restart: always
    command:
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--log.level=INFO"
    environment:
      - DOCKER_API_VERSION=1.41  # <--- Agrega esta línea
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "./letsencrypt:/letsencrypt"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - proxy-net

networks:
  proxy-net: # Red pública para Traefik
    #external: true
    driver: bridge
    name: savia_proxy

