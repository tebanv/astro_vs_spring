version: '3.8'

services:
  traefik:
    image: traefik:v3.6.10
    container_name: traefik
    restart: always
    command:
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      # NUEVOS PUERTOS DE ESCUCHA
      - "--entrypoints.web.address=:81"          # <--- Escucha en el 81
      - "--entrypoints.websecure.address=:8080"  # <--- Escucha en el 8080
      - "--log.level=INFO"
    environment:
      - DOCKER_API_VERSION=1.41  # <--- Agrega esta línea
    ports:
      - "81:81"
      - "8080:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - proxy-net

networks:
  proxy-net: # Red pública para Traefik
    #external: true
    driver: bridge
    name: savia_proxy

